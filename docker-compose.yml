#version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: gateway-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  user-service:
    build:
      context: ./user-service
    container_name: user-service
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy

  order-service:
    build:
      context: ./order-service
    container_name: order-service
    ports:
      - "8082:8082"

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      USER_SERVICE_HOST: user-service
      ORDER_SERVICE_HOST: order-service
      JWT_SECRET: ThisIsADemoSecretKeyForJWT_ReplaceInProduction_MinimumOf32Chars!!
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
      order-service:
        condition: service_started
